substitutions:
  # Override these per bulb with ESPHome's `-s` command-line option.
  node_name: gx53-test
  friendly_name: GX53 Test

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

bk72xx:
  board: generic-bk7231n-qfn32-tuya

wifi:
  # No pinned BSSID and no fallback AP, so the bulbs keep scanning. UniFi's
  # "lock to AP" refuses every other BSSID of the SSID; ESPHome lowers the
  # priority of a BSSID after two failed attempts and tries the next one on
  # the following scan, so the bulb ends up on whichever AP it is locked to.
  # A fallback AP stopped that scanning (blind retries only) and disabled the
  # 15-minute reboot below, which left bulbs offline for long periods.
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10

    # Recovery network that normally doesn't exist. If a bulb can't join the
    # main network, host this SSID (e.g. `nmcli dev wifi hotspot` on a nearby
    # machine); the bulb finds it on its next scan and joins as a client, so
    # it can be updated over the air.
    - ssid: !secret recovery_wifi_ssid
      password: !secret recovery_wifi_password
      priority: 0

  # Roaming moves to a stronger BSSID of the same SSID, which UniFi refuses
  # for a locked client.
  post_connect_roaming: false

  # Without Wi-Fi for this long, reboot and start over with a fresh scan.
  reboot_timeout: 15min

logger:
  baud_rate: 0

web_server:
  port: 80
  version: 3
  local: true

ota:
  - platform: esphome
  - platform: web_server

external_components:
  - source:
      type: local
      path: components
    components: [gx53_mixer]

mqtt:
  broker: mqtt.fruitiex.org
  topic_prefix: esphome/${node_name}
  discovery: true

  # Don't waste network/CPU sending debug logs over MQTT.
  log_topic: null

# BP5768 in this lamp is compatible with ESPHome's BP5758D driver.
bp5758d:
  data_pin: P24
  clock_pin: P26

output:
  - platform: bp5758d
    id: hw_red
    channel: 3
    current: 6

  - platform: bp5758d
    id: hw_green
    channel: 2
    current: 6

  - platform: bp5758d
    id: hw_blue
    channel: 1
    current: 6

  - platform: bp5758d
    id: hw_cold_white
    channel: 5
    current: 8

  - platform: bp5758d
    id: hw_warm_white
    channel: 4
    current: 8

light:
  - platform: gx53_mixer
    id: gx53_light
    name: Light

    red: hw_red
    green: hw_green
    blue: hw_blue
    cold_white: hw_cold_white
    warm_white: hw_warm_white

    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K

    rgb_white_color_temperature: 4000 K
    white_extraction: 100%
    minimum_brightness: 13%

    current_budget_ma: 14
    red_current_ma: 6
    green_current_ma: 6
    blue_current_ma: 6
    cold_white_current_ma: 8
    warm_white_current_ma: 8

    # The output starts locked until the first safe temperature reading. A
    # thermal trip stays locked for at least one minute and until the chip has
    # cooled to 75 C; ON commands are rejected throughout the lockout.
    temperature_sensor: chip_temperature
    thermal_shutdown_temperature: 85 °C
    thermal_reset_temperature: 75 °C
    thermal_cooldown: 60s
    thermal_lockout:
      name: "Thermal Lockout"

    # While the light is off, glow faintly to show connectivity problems:
    # red = no Wi-Fi, blue = no MQTT broker. Shown
    # at once until the first full connection after boot, then only after a
    # problem persists for status_indicator_delay.
    status_indicator: true
    status_indicator_delay: 30s

    default_transition_length: 250ms
    restore_mode: ALWAYS_OFF


sensor:
  - platform: internal_temperature
    id: chip_temperature
    name: "Chip Temperature"
    update_interval: 10s
    entity_category: diagnostic

  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal"
    update_interval: 30s
    entity_category: diagnostic

  #- platform: debug
    #free:
      #name: "Heap Free"
    #block:
      #name: "Heap Max Block"
    #min_free:
      #name: "Heap Min Free"
    #fragmentation:
      #name: "Heap Fragmentation"
    #loop_time:
      #name: "Loop Time"
    #psram:
      #name: "Free PSRAM"
    #cpu_frequency:
      #name: "CPU Frequency"

debug:
  update_interval: 10s

text_sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    bssid:
      name: "WiFi BSSID"
      entity_category: diagnostic

  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

  - platform: safe_mode
    name: "Restart in Safe Mode"
    entity_category: diagnostic
