substitutions:
  node_name: gx53-test

esphome:
  name: ${node_name}
  friendly_name: GX53 Test

bk72xx:
  board: generic-bk7231n-qfn32-tuya

wifi:
  ssid: "***REMOVED_WIFI_SSID***"
  password: "***REMOVED_WIFI_PASSWORD***"

  # Safety net in case normal Wi-Fi doesn't work.
  ap:
    ssid: "GX53 Test Fallback"
    password: "***REMOVED_FALLBACK_AP_PASSWORD***"

captive_portal:

logger:
  baud_rate: 0

web_server:
  port: 80
  version: 3
  local: true

ota:
  - platform: esphome
  - platform: web_server

external_components:
  - source:
      type: local
      path: components
    components: [gx53_mixer]

mqtt:
  broker: mqtt.fruitiex.org
  topic_prefix: esphome/${node_name}
  discovery: true

  # Don't waste network/CPU sending debug logs over MQTT.
  log_topic: null

  # Replaces ESPHome's built-in MQTT light command parser so we can add
  # transition_ms while keeping the normal ESPHome JSON light command format.
  on_json_message:
    - topic: "esphome/${node_name}/light/light/command"
      then:
        - lambda: |-
            esphome::gx53_mixer::handle_mqtt_light_command(
                *id(gx53_light), x);

# BP5768 in this lamp is compatible with ESPHome's BP5758D driver.
bp5758d:
  data_pin: P24
  clock_pin: P26

output:
  - platform: bp5758d
    id: hw_red
    channel: 3
    current: 4

  - platform: bp5758d
    id: hw_green
    channel: 2
    current: 4

  - platform: bp5758d
    id: hw_blue
    channel: 1
    current: 4

  - platform: bp5758d
    id: hw_cold_white
    channel: 5
    current: 6

  - platform: bp5758d
    id: hw_warm_white
    channel: 4
    current: 6

light:
  - platform: gx53_mixer
    id: gx53_light
    name: Light

    red: hw_red
    green: hw_green
    blue: hw_blue
    cold_white: hw_cold_white
    warm_white: hw_warm_white

    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K

    rgb_white_color_temperature: 4000 K
    white_extraction: 100%

    current_budget_ma: 12
    red_current_ma: 4
    green_current_ma: 4
    blue_current_ma: 4
    cold_white_current_ma: 6
    warm_white_current_ma: 6

    default_transition_length: 250ms
    restore_mode: ALWAYS_OFF

    command_topic: null

sensor:
  - platform: internal_temperature
    id: chip_temperature
    name: "Chip Temperature"
    update_interval: 10s
    entity_category: diagnostic

    # Belt-and-suspenders thermal protection.
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(chip_temperature).state >= 80.0;'
            then:
              - light.turn_off: gx53_light
              - logger.log:
                  level: WARN
                  format: "Thermal shutdown: BK7231N temperature >= 80 C"

  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal"
    update_interval: 30s
    entity_category: diagnostic

text_sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    bssid:
      name: "WiFi BSSID"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

  - platform: safe_mode
    name: "Restart in Safe Mode"
    entity_category: diagnostic
